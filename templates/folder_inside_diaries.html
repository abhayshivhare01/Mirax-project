<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Folder View</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, Helvetica, sans-serif;
        }

        body{
            background:#121212;
            color:white;
            display:flex;
            justify-content:center;
            align-items:center;
            min-height:100vh;
            padding:30px;
        }

        .container{
            width:550px;
            background:#1e1e1e;
            padding:35px;
            border-radius:20px;
            box-shadow:0 0 20px rgba(0,0,0,0.5);
        }

        .title{
            text-align:center;
            font-size:34px;
            margin-bottom:30px;
            color:#8b5cf6;
        }

        .diary-list{
            display:flex;
            flex-direction:column;
            gap:18px;
        }

        .diary-item{
            background:#2a2a2a;
            padding:18px;
            border-radius:14px;
            font-size:18px;
            cursor:pointer;
            transition:0.3s;
            border-left:5px solid #8b5cf6;
        }

        .diary-item:hover{
            background:#8b5cf6;
            transform:translateX(5px);
        }

    </style>
</head>

<body>

    <div class="container">

        <div class="title"> 📂 Folder: {{ folder_name }} </div>

        <div class="diary-list">

            {% for diary in diaries %}

            <a href="/diary/{{ diary[0] }}"
            style="text-decoration:none; color:white;">

                <div class="diary-item"> {{ diary[2] }} </div>
            </a>
            {% endfor %}
        </div>
    </div>

</body>
</html>
