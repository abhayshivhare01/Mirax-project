<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edit Diary</title>
</head>

<body style="background:#121212; color:white; font-family:Arial;">

    <div style="width:600px; margin:auto; padding:30px;">

        <h1>Edit Diary</h1>

        <form method="POST">

            <input type="text"
                   name="title"
                   value="{{ diary[2] }}"
                   style="width:100%; padding:10px; margin-bottom:20px;">

            <textarea name="content"
                      style="width:100%; height:200px; padding:10px; margin-bottom:20px;">{{ diary[3] }}</textarea>

            <select name="mood"
                    style="width:100%; padding:10px; margin-bottom:20px;">

                <option>{{ diary[4] }}</option>

                <option>😊 Happy</option>
                <option>😔 Sad</option>
                <option>😌 Calm</option>
                <option>🚀 Excited</option>

            </select>

            <button type="submit"
                    style="padding:12px 25px; background:#8b5cf6; color:white; border:none; border-radius:10px;">

                Save Changes

            </button>

        </form>

    </div>

</body>
</html>
