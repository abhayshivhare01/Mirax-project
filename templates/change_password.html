<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Password</title>

    <style>

        body{
            background:#121212;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
            font-family:Arial;
            color:white;
        }

        .box{
            background:#1e1e1e;
            padding:40px;
            border-radius:20px;
            width:400px;
        }

        h1{
            text-align:center;
            margin-bottom:30px;
            color:#8b5cf6;
        }

        input{
            width:100%;
            padding:12px;
            margin-bottom:20px;
            border:none;
            border-radius:10px;
            background:#2a2a2a;
            color:white;
        }

        button{
            width:100%;
            padding:12px;
            border:none;
            border-radius:10px;
            background:#8b5cf6;
            color:white;
            font-size:16px;
            cursor:pointer;
        }

    </style>

</head>

<body>

    <div class="box">

        <h1>Change Password</h1>

        <form method="POST">

            <input type="password"
                   name="old_password"
                   placeholder="Old Password">

            <input type="password"
                   name="new_password"
                   placeholder="New Password">

            <button type="submit">
                Update Password
            </button>

        </form>

    </div>

</body>
</html>
