<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, Helvetica, sans-serif;
        }

        body{
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background:#121212;
        }

        .register-container{
            width:380px;
            background:#1e1e1e;
            padding:40px;
            border-radius:20px;
            box-shadow:0 0 20px rgba(0,0,0,0.5);
            text-align:center;
        }

        .register-container h1{
            color:white;
            margin-bottom:30px;
            font-size:30px;
        }

        .input-box{
            width:100%;
            margin-bottom:20px;
        }

        .input-box input{
            width:100%;
            padding:12px;
            border:none;
            border-radius:10px;
            background:#2c2c2c;
            color:white;
            font-size:16px;
            outline:none;
        }

        .input-box input::placeholder{
            color:#bbbbbb;
        }

        .register-btn{
            width:100%;
            padding:12px;
            border:none;
            border-radius:10px;
            background:#8b5cf6;
            color:white;
            font-size:16px;
            cursor:pointer;
            transition:0.3s;
        }

        .register-btn:hover{
            background:#7c3aed;
        }

        .login-text{
            margin-top:20px;
            color:#cccccc;
            font-size:14px;
        }

        .login-text a{
            color:#8b5cf6;
            text-decoration:none;
            font-weight:bold;
        }

        .login-text a:hover{
            text-decoration:underline;
        }

    </style>

</head>

<body>

    <div class="register-container">

        <h1>Create Account</h1>

        <form method="post">

            <div class="input-box">
                <input type="text" name='username' placeholder="Username" required>
            </div>

            <div class="input-box">
                <input type="email" name='email' placeholder="Email" required>
            </div>

            <div class="input-box">
                <input type="password" name='password' placeholder="Password" required>
            </div>

            <input type="submit" class="register-btn" value="Register">

        </form>

        <div class="login-text">
            Already have an account?
            <a href="/">Login</a>
        </div>

    </div>

</body>
</html>
