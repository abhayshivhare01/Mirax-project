<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Folders Page</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, Helvetica, sans-serif;
        }

        body{
            background:#121212;
            color:white;
            display:flex;
            justify-content:center;
            align-items:center;
            min-height:100vh;
            padding:30px;
        }

        .container{
            width:500px;
            background:#1e1e1e;
            padding:35px;
            border-radius:20px;
            box-shadow:0 0 20px rgba(0,0,0,0.5);
        }
        .diary-link{
            text-decoration: none; /* Keeps the card looking like a card, not a blue link */
            color: inherit;
            display: block;
        }

        .title{
            text-align:center;
            font-size:36px;
            margin-bottom:35px;
            color:#8b5cf6;
        }

        .folder-list{
            display:flex;
            flex-direction:column;
            gap:20px;
        }

        .folder{
            background:#2a2a2a;
            padding:18px;
            border-radius:15px;
            font-size:18px;
            cursor:pointer;
            transition:0.3s;
            border-left:5px solid #8b5cf6;
        }

        .folder:hover{
            background:#8b5cf6;
            transform:translateX(5px);
        }

    </style>
</head>

<body>

    <div class="container">

        <div class="title">
            📂 Folders
        </div>

        <div class="folder-list">

            {% for folder in folders %}

            <a href="/folder_inside_diaries/{{ folder['folder_name'] }}" class="diary-link">
                <div class="folder">
                📂 {{ folder['folder_name'] }}
                 </div>
            </a>
            {% endfor %}

        </div>

    </div>

</body>
</html>
